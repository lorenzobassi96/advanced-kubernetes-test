apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: telemetry-gateway
  namespace: default
spec:
  gatewayClassName: istio
  # Pin the MetalLB-assigned IP so Prometheus' external-url stays stable.
  # Must be an address from your telemetry-pool range (see telemetry/metallb-pool.yaml).
  addresses:
    - type: IPAddress
      value: 172.24.223.240
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
